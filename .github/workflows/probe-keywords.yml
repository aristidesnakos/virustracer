name: Probe keywords
# Throwaway: Google autocomplete for the terms our pages could target (keyless, read-only).
on:
  push:
    branches: [research/keyword-probe]
    paths: [scripts/probe-keywords.mjs, .github/workflows/probe-keywords.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probe-keywords
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/probe-keywords.mjs
