name: Probe feed sources

# Keyless check of candidate news sources for the outbreak feeds (scripts/probe-feeds.mjs): status,
# format, how much article text each item carries, and keyword matches per outbreak. No secrets,
# no model calls. Manual only (Actions > Probe feed sources > Run workflow): the build sandbox
# cannot reach these hosts, the runners can. Run 42487722439 (2026-11-08) chose the current sources.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Probe only candidates whose name or URL contains this text (empty: all)"
        default: ""
        type: string
      pipeline:
        description: "Run the real feed pipeline on the live feeds instead (no model, writes nothing)"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: probe-feeds
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe candidate sources
        run: |
          if [ "$PIPELINE" = "true" ]; then node scripts/probe-feeds.mjs --pipeline
          else node scripts/probe-feeds.mjs ${ONLY:+--only="$ONLY"}; fi
        env:
          ONLY: ${{ inputs.only }}
          PIPELINE: ${{ inputs.pipeline }}
