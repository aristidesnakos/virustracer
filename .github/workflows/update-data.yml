name: Update Outbreak Data

on:
  schedule:
    # Twice daily (08:00 and 20:00 UTC) — the death toll moves daily
    - cron: "0 8,20 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

concurrency:
  group: update-outbreak-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 22, not 10: the feed step alone takes about 7.5 minutes, and at 10 the job was cancelled before
    # the commit step in 12 of the 14 runs up to 2026-11-06, so no data was saved.
    timeout-minutes: 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # --omit=dev: every script run below imports only node built-ins and `openai` (a runtime
        # dependency); the dev tools (Playwright, Vitest, Tailwind, ...) are not needed here.
        run: npm ci --omit=dev

      - name: Update death-toll snapshots
        # Wikipedia-backed outbreaks only. Outbreaks read from an official weekly report
        # (West Nile virus in Greece) have their own workflow, update-west-nile.yml.
        run: node scripts/update-toll.mjs --adapter=wikipedia

      - name: Update CDC measles figures
        # US measles: the CDC's national page and the two JSON files behind it, updated once a
        # week (counts as of Thursday noon). Most runs find the week already stored and only
        # refresh lastChecked. Plain HTTPS GETs; if the CDC ever refuses GitHub's runners (as
        # EODY does), this logs a warning and exits 0 like every other reader, so the steps
        # below still run.
        run: node scripts/update-toll.mjs --adapter=cdc-measles

      - name: Update CDC NNDSS figures
        # Candida auris in the US: CDC's weekly notifiable-disease table on data.cdc.gov (one
        # JSON query), published once a week; most runs find no new week and only refresh
        # lastChecked. If data.cdc.gov refuses GitHub's runners, this logs a warning and exits 0.
        run: node scripts/update-toll.mjs --adapter=cdc-nndss

      - name: Update nursing-home data
        # Not an outbreak: CDC NHSN respiratory figures for nursing-home residents (data.cdc.gov
        # and www.cdc.gov) and CMS F880 infection-control citations (data.cms.gov). Metadata is
        # checked first; CMS's rows are fetched only when it publishes a new release (about
        # monthly). Warns and exits 0 on any failure, including a host refusing GitHub's runners.
        run: node scripts/update-nursing-homes.mjs

      - name: Fetch feeds and update live data
        id: feeds
        # Own 12-minute cap (estimated, not yet measured: steady state 1-2 minutes, a cold start with every feed full
        # 4-5): a slow or hung feed step is stopped by this timer, not by the job's 22
        # minutes, so the archive and commit steps below still get their time. The script saves
        # its progress after every item, so what it finished is committed.
        # continue-on-error keeps the job going after a failure or a timeout (the commit step
        # must run); the last step, "Fail the run if feeds failed", turns it into a red run.
        timeout-minutes: 12
        continue-on-error: true
        env:
          # OpenRouter key (uses DeepSeek V4 Flash for cheap summarization)
          # Set this in GitHub repo Settings → Secrets → OPENROUTER_API_KEY
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/fetch-feeds.mjs

      - name: Archive sources (Internet Archive)
        # Best-effort and rate-limited; never fails the job (exits 0 on error). The 5-minute cap and
        # continue-on-error mean a slow Internet Archive can never skip the commit step below.
        timeout-minutes: 5
        continue-on-error: true
        run: node scripts/archive-sources.mjs

      - name: Commit updated data
        env:
          REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in data/outbreaks data/nursing-homes data/archive.json data/raw; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update outbreak feed [skip ci]"
            git pull --rebase --autostash origin "$REF"
            git push
          fi

      - name: Summarize death tolls
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const root = "data/outbreaks";
            const md = ["## Latest death tolls", ""];
            for (const slug of fs.existsSync(root) ? fs.readdirSync(root).sort() : []) {
              // Hand-curated records (e.g. an archived outbreak) have no toll.json.
              if (!fs.existsSync(root + "/" + slug + "/toll.json")) continue;
              let t = {};
              try { t = JSON.parse(fs.readFileSync(root + "/" + slug + "/toll.json", "utf8")); } catch {}
              const l = (Array.isArray(t.snapshots) && t.snapshots[t.snapshots.length - 1]) || t.latest || t;
              const g = (...k) => { for (const x of k) if (l[x] != null) return l[x]; return "n/a"; };
              md.push(
                "### " + slug,
                "",
                "- As of: " + g("date", "asOf", "as_of"),
                "- Confirmed cases: " + g("confirmed", "confirmedCases"),
                "- Deaths: " + g("deaths", "deathToll"),
                "- Source: " + g("source", "sourceName"),
                ""
              );
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md.join("\n"));
          '

      - name: Fail the run if feeds failed
        # Last step, after the commit. With continue-on-error the feed step's failure is hidden
        # (the job would end green), so say it here: red run, GitHub's failure email goes out.
        # outcome is "failure" for an error and for the step timeout; "cancelled" is included in
        # case GitHub reports a timeout that way.
        if: always() && (steps.feeds.outcome == 'failure' || steps.feeds.outcome == 'cancelled')
        run: |
          echo "::error::The feed step ${{ steps.feeds.outcome }}. Data that was finished was committed; see that step's log."
          exit 1
