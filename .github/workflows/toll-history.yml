name: Toll history (temporary)

# TEMPORARY: one run to trace the Ebola deaths figure on Wikipedia (5,376 stored on 2026-11-02,
# 5,234 on the page since); removed in the next commit.
on:
  push:
    branches: [fix/feed-model-empty-responses]
    paths: [.github/workflows/toll-history.yml]

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/toll-history.mjs --outbreak=ebola-bundibugyo-2026 --from=2026-10-27
