name: Diagnose feed model

# Probes the news-feed model calls (scripts/diagnose-model.mjs): public model metadata, the
# production code path, a comparison with other models, and whether article links can be read.
# Manual only (Actions > Diagnose feed model > Run workflow), so the OPENROUTER_API_KEY secret is
# read only when someone starts it. A run makes at most `max_calls` model calls (default 700 when
# started by hand, 450 if the script runs without it); the two runs below cost $0.0077 and $0.0108.
# Runs on 2026-11-08: 42482944426 (matrix: root cause) and 42483895720 (verify).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify (production path, model comparison, article links) or matrix (the original probe matrix)"
        default: verify
        type: choice
        options: [verify, matrix]
      alts:
        description: "verify only: comma-separated OpenRouter model ids to compare with the production model (empty = newest of each non-Chinese family in scripts/diagnose-model.mjs)"
        default: ""
        type: string
      max_calls:
        description: "hard cap on live model calls (a six-model comparison needs about 600)"
        default: "700"
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-model
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev
      - name: Run the probe matrix
        run: node scripts/diagnose-model.mjs --mode="${MODE}"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODE: ${{ inputs.mode || 'verify' }}
          DIAGNOSE_ALTS: ${{ inputs.alts }}
          DIAGNOSE_MAX_CALLS: ${{ inputs.max_calls || '450' }}
